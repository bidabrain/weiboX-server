# 一次性任务：生成固定的 debug keystore 并提交回仓库。
# 跑完一次就不用再管了（重复运行会被下面的存在性检查挡掉）。
name: Bootstrap debug keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 已存在则中止
        run: |
          if [ -f app/debug.keystore ]; then
            echo "::error::app/debug.keystore 已存在，无需再次生成（重新生成会导致签名变化、装不上覆盖更新）"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成 keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storetype PKCS12 \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 \
            -validity 10950

      - name: 打印指纹（记下来，以后换机器可核对）
        run: |
          keytool -list -v -keystore app/debug.keystore -storepass android -alias androiddebugkey \
            | grep -E "SHA1:|SHA256:|Valid from" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 提交回仓库
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add app/debug.keystore
          git commit -m "chore(ci): 添加固定 debug keystore 用于 release 签名"
          git push
